<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"voAudioSrc","type":"string","label":"VO audio","default":""}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Anton';
        src: url('fonts/Anton-Regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Inter';
        src: url('fonts/Inter-SemiBold.ttf') format('truetype');
        font-weight: 600;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
      }
      .layer {
        position: absolute;
      }
      .fill {
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      .bg {
        overflow: hidden;
      }
      /* Non-timed wrapper inside the beat's clip: the still's Ken Burns motion targets this, never the clip itself. */
      .still-inner {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 50%;
      }
      .cover-video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .cover {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .text-box {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .text-box .line {
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <!--
      data-duration on the root (and below, on the audio element) is resolved statically from the
      source text before any script runs, so `studio render` templates the real duration in here
      rather than setting it from JS (see src/render.ts).
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION_SEC}}" data-width="1080" data-height="1920">
      <audio id="vo-audio" class="clip" data-start="0" data-duration="{{DURATION_SEC}}" data-track-index="9" data-volume="1" data-var-src="voAudioSrc"></audio>
      {{MEDIA_ELEMENTS}}
    </div>
    <script>
      const { timeline, tokens, layout } = window.__hyperframes.getVariables();
      const root = document.getElementById('root');

      const color = (name) => tokens.colors[name] ?? name;

      function make(tag, attrs = {}) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === 'text') node.textContent = v;
          else if (k === 'html') node.innerHTML = v;
          else if (k === 'style') Object.assign(node.style, v);
          else if (k === 'class') node.className = v;
          else node.setAttribute(k, v);
        }
        return node;
      }

      /** A clip: positioned full-frame or boxed, visible only for [start, start+duration). */
      function clip(tag, { start, duration, trackIndex, cls, style }) {
        return make(tag, {
          class: `layer clip${cls ? ' ' + cls : ''}`,
          'data-start': String(start),
          'data-duration': String(Math.max(duration, 0.001)),
          'data-track-index': String(trackIndex),
          style,
        });
      }

      /** A text-box layout result ({ box, lines }) rendered as one line per div inside `container`. */
      function renderLines(container, textBox, role, px, extraLineStyle = {}) {
        const font = tokens.fonts[role];
        for (const text of textBox.lines) {
          container.appendChild(
            make('div', {
              class: 'line',
              text,
              style: {
                fontFamily: font.family,
                fontWeight: String(font.weight ?? 400),
                fontSize: `${px}px`,
                lineHeight: String(tokens.line_height[role]),
                ...extraLineStyle,
              },
            }),
          );
        }
      }

      function boxStyle(box) {
        return { left: `${box.x}px`, top: `${box.y}px`, width: `${box.w}px`, height: `${box.h}px` };
      }

      const tl = gsap.timeline({ paused: true });

      // --- Background (z=0): one full-frame clip per beat. Hard cut, no transition (SPEC section 1/6). ---
      for (const beat of timeline.beats) {
        // A clip beat's <video> elements are static markup (see src/media.ts); nothing to draw here, and a
        // solid backing div would cover them.
        if (beat.visual.type === 'clip') continue;
        const bg = clip('div', {
          start: beat.start,
          duration: beat.end - beat.start,
          trackIndex: 0,
          cls: 'fill bg',
          style: { backgroundColor: color(beat.visual.color ?? 'bg') },
        });
        const plan = layout.motion[beat.id];
        if (beat.visual.type === 'still') {
          const inner = make('div', { class: 'still-inner', id: `still-${beat.id}` });
          const img = make('img', { class: 'cover', src: `assets/${encodeURI(beat.visual.asset)}` });
          if (plan?.camera) {
            // Preset camera (src/motion.ts): the punch-in crop lives on its own wrapper so the push/drift
            // on #still-<id> keeps running underneath the hard cut.
            const punch = make('div', { class: 'still-inner', id: `punch-${beat.id}` });
            punch.appendChild(img);
            inner.appendChild(punch);
          } else {
            inner.appendChild(img);
          }
          bg.appendChild(inner);
          if (plan?.camera) {
            const dur = beat.end - beat.start;
            const cam = plan.camera;
            // Eased push-in on scale; slow drift as finite yoyo sines on x and y (repeat counts are computed,
            // never -1, so every frame is reachable by seeking).
            tl.fromTo(`#still-${beat.id}`, { scale: cam.base }, { scale: cam.end, duration: dur, ease: cam.ease }, beat.start);
            for (const [prop, d] of [['x', cam.driftX], ['y', cam.driftY]]) {
              tl.fromTo(
                `#still-${beat.id}`,
                { [prop]: -d.sign * d.amp },
                { [prop]: d.sign * d.amp, duration: d.halfSec, ease: 'sine.inOut', repeat: Math.ceil(dur / d.halfSec) - 1, yoyo: true },
                beat.start,
              );
            }
            if (plan.punch) tl.set(`#punch-${beat.id}`, { scale: plan.punch.scale }, plan.punch.at);
            if (plan.glow) {
              const g = plan.glow;
              tl.fromTo(
                `#still-${beat.id}`,
                { filter: `brightness(${1 - g.amount})` },
                { filter: `brightness(${1 + g.amount})`, duration: g.halfSec, ease: 'sine.inOut', repeat: Math.ceil(dur / g.halfSec) - 1, yoyo: true },
                beat.start,
              );
            }
          } else {
            // Seek-safe Ken Burns (hyperframes-keyframes): one fromTo on the non-timed wrapper, linear over the
            // whole beat, registered on the paused main timeline so it scrubs to any frame. Poses come from
            // src/media.ts stillMotion (tokens.motion), never hardcoded here.
            const { from, to } = layout.stills[beat.id];
            tl.fromTo(
              `#still-${beat.id}`,
              { scale: from.scale, x: from.x },
              { scale: to.scale, x: to.x, duration: beat.end - beat.start, ease: 'none' },
              beat.start,
            );
          }
        }
        if (beat.visual.type === 'typography') {
          const box = layout.typography[beat.id];
          const role = 'display';
          const px = beat.visual.style === 'number' ? tokens.type_scale.typography_number : tokens.type_scale.typography_statement;
          const card = plan?.numberCard;
          if (card?.prev) {
            // Number card: the previous beat's picture, dimmed and held at where its camera ended, instead of a plain backdrop.
            const dimmed = make('div', { class: 'still-inner', id: `dim-${beat.id}`, style: { filter: `brightness(${card.prev.dim})` } });
            dimmed.appendChild(make('img', { class: 'cover', src: `assets/${encodeURI(card.prev.asset)}` }));
            bg.appendChild(dimmed);
            tl.fromTo(`#dim-${beat.id}`, { scale: card.prev.scale }, { scale: card.prev.scale * 1.04, duration: beat.end - beat.start, ease: 'none' }, beat.start);
          }
          const textEl = make('div', { class: 'text-box', id: `num-${beat.id}`, style: boxStyle(box.box) });
          renderLines(textEl, box, role, px, { color: color('text'), textAlign: 'center' });
          bg.appendChild(textEl);
          if (card) {
            // Slam-in (fast ease-out from oversize), then a soft finite pulse until the beat ends.
            const dur = beat.end - beat.start;
            tl.fromTo(`#num-${beat.id}`, { scale: card.slamFrom, opacity: 0 }, { scale: 1, opacity: 1, duration: card.slamSec, ease: 'power4.out' }, beat.start);
            const left = dur - card.slamSec;
            if (left > 0) {
              tl.fromTo(
                `#num-${beat.id}`,
                { scale: 1 },
                { scale: 1 + card.pulse, duration: card.pulseHalfSec, ease: 'sine.inOut', repeat: Math.max(0, Math.ceil(left / card.pulseHalfSec) - 1), yoyo: true },
                beat.start + card.slamSec,
              );
            }
          }
        }
        root.appendChild(bg);
      }

      // --- Embers (above the picture, below grade/label/overlays/captions): seeded drifting sparks per beat with a
      // preset. Screen-blended, and masked down behind text bands so they never sit behind captions at high opacity. ---
      for (const beat of timeline.beats) {
        const em = layout.motion[beat.id]?.embers;
        if (!em) continue;
        const dur = beat.end - beat.start;
        const layer = clip('div', {
          start: beat.start,
          duration: dur,
          trackIndex: 1,
          cls: 'fill',
          style: { mixBlendMode: 'screen', webkitMaskImage: em.mask, maskImage: em.mask, pointerEvents: 'none' },
        });
        em.items.forEach((e, k) => {
          const id = `ember-${beat.id}-${k}`;
          layer.appendChild(
            make('div', {
              id,
              style: {
                position: 'absolute',
                left: `${e.x - e.size / 2}px`,
                top: `${e.y0}px`,
                width: `${e.size}px`,
                height: `${e.size}px`,
                borderRadius: '50%',
                background: 'radial-gradient(circle, rgba(255,214,140,1) 0%, rgba(232,165,75,0.55) 45%, rgba(232,165,75,0) 72%)',
                opacity: String(e.opacity),
              },
            }),
          );
          tl.fromTo(`#${id}`, { y: 0 }, { y: e.y1 - e.y0, duration: dur, ease: 'none' }, beat.start);
          tl.fromTo(`#${id}`, { x: -e.sway }, { x: e.sway, duration: e.swaySec, ease: 'sine.inOut', repeat: Math.max(0, Math.ceil(dur / e.swaySec) - 1), yoyo: true }, beat.start);
          tl.fromTo(`#${id}`, { opacity: e.opacity * 0.3 }, { opacity: e.opacity, duration: e.twinkleSec, ease: 'sine.inOut', repeat: Math.max(0, Math.ceil(dur / e.twinkleSec) - 1), yoyo: true }, beat.start);
        });
        root.appendChild(layer);
      }

      // --- Grade (z=1): vignette for the whole video; extra darkening bands behind text on still/clip beats. ---
      {
        const g = tokens.grade;
        root.appendChild(
          clip('div', {
            start: 0,
            duration: timeline.duration_sec,
            trackIndex: 1,
            cls: 'fill',
            style: { background: `radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,${g.vignette}) 100%)` },
          }),
        );
        const f = g.darken_feather_px;
        for (const beat of timeline.beats) {
          for (const band of layout.scrims[beat.id] ?? []) {
            const edge = `${((f / band.h) * 100).toFixed(3)}%`;
            const solid = `rgba(0,0,0,${band.alpha})`;
            root.appendChild(
              clip('div', {
                start: beat.start,
                duration: beat.end - beat.start,
                trackIndex: 1,
                cls: 'layer',
                style: {
                  left: '0px',
                  width: `${tokens.canvas.width}px`,
                  top: `${band.y}px`,
                  height: `${band.h}px`,
                  background: `linear-gradient(to bottom, rgba(0,0,0,0), ${solid} ${edge}, ${solid} calc(100% - ${edge}), rgba(0,0,0,0))`,
                },
              }),
            );
          }
        }
      }

      // --- Series label (z=2): persistent for the full video, hidden if absent. ---
      if (layout.label) {
        const el = clip('div', { start: 0, duration: timeline.duration_sec, trackIndex: 1, cls: 'text-box', style: boxStyle(layout.label.box) });
        renderLines(el, layout.label, 'body', tokens.type_scale.label, { color: color('muted'), textAlign: 'center' });
        root.appendChild(el);
      }

      // --- Overlays (z=3): one per beat that has one, spanning its beat. ---
      for (const beat of timeline.beats) {
        if (!beat.overlay) continue;
        const box = layout.overlays[beat.id];
        const style = beat.overlay.style ?? 'card';
        const px = tokens.type_scale[style === 'hook_slam' ? 'hook_slam' : style === 'kicker' ? 'kicker' : 'card'];
        const role = style === 'hook_slam' ? 'display' : 'body';
        const [padV, padH] = style === 'card' ? tokens.padding.card : [0, 0];
        const id = `overlay-${beat.id}`;
        const el = clip('div', {
          start: beat.start,
          duration: beat.end - beat.start,
          trackIndex: 2,
          cls: 'text-box',
          style: {
            ...boxStyle(box.box),
            padding: `${padV}px ${padH}px`,
            backgroundColor: style === 'card' ? color('card_bg') : 'transparent',
            borderRadius: style === 'card' ? `${tokens.radius.card}px` : '0',
          },
        });
        el.id = id;
        renderLines(el, box, role, px, { color: color('text'), textAlign: 'center' });
        root.appendChild(el);
        if (style === 'card') {
          tl.fromTo(`#${id}`, { opacity: 0 }, { opacity: 1, duration: tokens.motion.overlay_in_ms / 1000 }, beat.start);
        }
      }

      // --- Captions (z=4): one per page. word_highlight colors the active word; phrase does not. ---
      const captionRole = 'body';
      const captionPx = tokens.type_scale.caption;
      timeline.caption_pages.forEach((page, i) => {
        const el = clip('div', {
          start: page.start,
          duration: page.end - page.start,
          trackIndex: 3,
          cls: 'text-box caption-box',
          style: boxStyle(layout.captions),
        });
        let w = page.word_indexes[0];
        for (const lineWords of page.lines) {
          // Font family/size/weight live on the line, not each span, so the plain space text nodes
          // between spans inherit them too (SPEC section 7) — otherwise those spaces render at the
          // browser's default font size instead of the caption size, narrower than fontkit predicted.
          const lineEl = make('div', {
            class: 'line',
            style: {
              fontFamily: tokens.fonts[captionRole].family,
              fontWeight: String(tokens.fonts[captionRole].weight ?? 400),
              fontSize: `${captionPx}px`,
              lineHeight: String(tokens.line_height[captionRole]),
              textShadow: '0 0 4px rgba(0,0,0,0.8), 0 0 4px rgba(0,0,0,0.8)',
            },
          });
          lineWords.forEach((text, wi) => {
            // A real space text node between spans, not CSS gap, so the browser lays out the same
            // space width the fontkit layout in timeline.ts measured (SPEC section 7).
            if (wi > 0) lineEl.appendChild(document.createTextNode(' '));
            const span = make('span', { text, style: { color: color('text') } });
            span.id = `word-${w}`;
            lineEl.appendChild(span);
            if (timeline.caption_style === 'word_highlight') {
              const word = timeline.words[w];
              tl.set(`#word-${w}`, { color: color('caption_highlight') }, word.start);
              tl.set(`#word-${w}`, { color: color('text') }, word.end);
            }
            w++;
          });
          el.appendChild(lineEl);
        }
        root.appendChild(el);
      });

      // --- CTA pop (z=5): scales in, fades out over the last 200ms (SPEC section 7). ---
      if (timeline.cta_pop && layout.cta) {
        const cta = timeline.cta_pop;
        const isBar = cta.style === 'bar';
        const [padV, padH] = tokens.padding.pill;
        const el = clip('div', {
          start: cta.start,
          duration: cta.end - cta.start,
          trackIndex: 4,
          cls: 'text-box',
          style: {
            ...boxStyle(layout.cta.box),
            padding: isBar ? `${padV}px 0` : `${padV}px ${padH}px`,
            backgroundColor: color('accent'),
            borderRadius: isBar ? '0' : `${tokens.radius.pill}px`,
            transformOrigin: 'center center',
          },
        });
        el.id = 'cta-pop';
        renderLines(el, layout.cta, 'body', tokens.type_scale.cta, { color: color('bg'), textAlign: 'center' });
        root.appendChild(el);
        tl.fromTo('#cta-pop', { scale: 0.9 }, { scale: 1, duration: tokens.motion.cta_in_ms / 1000 }, cta.start);
        tl.to('#cta-pop', { opacity: 0, duration: 0.2 }, Math.max(cta.start, cta.end - 0.2));
      }

      // --- End card (z=6): optional, full frame, appended after the tail. ---
      if (timeline.end_card && layout.end_card) {
        const card = timeline.end_card;
        const el = clip('div', { start: card.start, duration: card.duration_sec, trackIndex: 5, cls: 'fill', style: { backgroundColor: color('bg') } });
        const textEl = make('div', { class: 'text-box', style: boxStyle(layout.end_card.box) });
        renderLines(textEl, layout.end_card, 'display', tokens.type_scale.typography_statement, { color: color('text'), textAlign: 'center' });
        el.appendChild(textEl);
        root.appendChild(el);
      }

      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
