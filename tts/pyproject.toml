[project]
name = "ttyng-tts"
version = "0.1.0"
description = "Local Kokoro-82M TTS for TTYNG Studio, called by src/tts/kokoro.ts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kokoro==0.9.4",
  # misaki's English G2P loads this spaCy model; pinned here so it never self-installs at runtime.
  "en-core-web-sm",
  "soundfile>=0.12",
  "torch>=2.4",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
